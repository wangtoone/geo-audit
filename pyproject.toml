[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geo-audit"
version = "0.1.0"
description = "查出你的公开信息里哪些位置会被 AI 读错或读不到（零 LLM，零 API key）"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "geo-audit contributors" }]
keywords = ["llms.txt", "geo", "aeo", "dead-links", "soft-404", "seo", "ai-crawler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
]
# httpx 不带 [http2]：client.py 里 http2=False，装了 h2 是纯多余依赖（卡点 5）
dependencies = [
  "httpx>=0.27,<0.29",
  "selectolax>=0.3.21",
  "dnspython>=2.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "check-jsonschema>=0.29",
]

[project.scripts]
geo-audit = "geo_audit.cli:main"

[project.urls]
Homepage = "https://github.com/toonewang/geo-audit"
Issues = "https://github.com/toonewang/geo-audit/issues"

# ── wheel 必须带上 fixtures 与 corpus ─────────────────────────────────────
# 卡点 B17b：smoke job 用 `uv tool run --from .` 装 wheel 后跑 --replay-fixtures，
# 只 package src/geo_audit 会让它开箱就 FixtureMissing。
[tool.hatch.build.targets.wheel]
packages = ["src/geo_audit"]
[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "geo_audit/_fixtures"
"corpus" = "geo_audit/_corpus"
"schema" = "geo_audit/_schema"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "fixtures", "corpus", "scripts", "schema",
           "LICENSE", "NOTICE", "README.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "live: 需要真网络，默认不跑（-m live 显式开启）",
  "gate: 假阳性门禁，CI 必过",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "S", "T20"]
# RUF001/002/003（ambiguous-unicode）在本项目必须关：注释与 docstring 全是中文，
# 全角标点（，。；（）"）是正确用法而不是同形字攻击。这三条规则的本意是防
# identifier 里的 homoglyph，对中文散文误报 100%。方案 §1.2 选了 RUF 全组但没
# 考虑这一点，实测第 1 步就报 16 条，全部是这三条。
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

# 卡点 B17c：原型从未跑过 lint，这三条 per-file-ignore 是实测出来的最小集
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"src/geo_audit/cli.py" = ["T201"]        # 进度输出走 print(file=sys.stderr)，不引 logging
"tests/*" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src/geo_audit"]
strict = true
warn_unreachable = true
[[tool.mypy.overrides]]
module = ["selectolax.*", "dns.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["geo_audit"]
branch = true
[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
