name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 卡点 B17a：--contact 无条件必填，replay 模式也不豁免（"做成可选等于没有"这条
# 约束不能因为跑 CI 就打折）。所以 CI 里显式传一个真实可达的项目邮箱。
env:
  GEO_AUDIT_CONTACT: ci@geo-audit.invalid

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --extra dev --python ${{ matrix.python }}
      # 断网跑：任何一条测试想摸真网络（含 DNS）都会立刻失败，而不是悄悄通过
      - name: pytest (offline)
        run: uv run pytest -m "not live" --cov --cov-report=term-missing
        env:
          GEO_AUDIT_FORBID_NETWORK: "1"
          GEO_AUDIT_FORBID_DNS: "1"      # 卡点 A8：DNS 不走 httpx，要单独一把闸

  labels:
    # 第 5 步已完成（scripts/verify_labels.py 与 tests/data/* 都在位），提前打开 ——
    # 标注可溯源性是 42 条判死的证据链，越早进 CI 越好。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      # 每条 provenance=recorded 的标注 URL 必须能在 corpus/feature-raw.json 里搜到
      - run: uv run python scripts/verify_labels.py

  fp-gate:
    # 第 12b 步已完成（scripts/fp_gate.py 本地退出码 0，六条门禁逐条为 true），已打开。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --extra dev
      - name: 假阳性门禁（六条硬条件，见 §8.6）
        run: uv run python scripts/fp_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fp-gate-report, path: fp-gate-report.json }

  schema:
    # 第 18 步已打开（§8.5 的 schema 与 --replay-fixtures 都在位）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      # ⚠️ mistral.ai **有发现**（1 个位置读错），所以 CLI 按 §7.1 退出码 1 ——
      # 那是「扫描完成，有发现」，不是失败。规格给的 CI 片段没接这个语义，
      # 于是 schema 与 smoke-uvx 两个 job 第一次真跑就红了。
      # 只把 4（用法错）/ 3（域不可达）/ 130（中断）当失败。
      - name: 产出 JSON 报告（退出码 1 = 有发现，是预期结果）
        run: |
          set +e
          uv run geo-audit --replay-fixtures mistral.ai \
            --contact ci@geo-audit.invalid --no-cache \
            --out /tmp/o --format json
          code=$?
          set -e
          echo "geo-audit 退出码 $code"
          case "$code" in
            0|1|2) : ;;
            *) echo "::error::CLI 退出码 $code（4=用法错 / 3=不可达 / 130=中断）"; exit 1 ;;
          esac
          test -s /tmp/o/mistral.ai.json
      - run: uv run check-jsonschema --schemafile schema/report-1.schema.json /tmp/o/mistral.ai.json

  smoke-uvx:
    # 第 18 步已打开（验证 force-include 把 fixtures 带进了 wheel）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # 「一行可跑」必须被测到，不能只写在 README 里。装成 wheel 跑，验证
      # force-include 把 fixtures 带进去了。
      # 同上：退出码 1 是「有发现」。见 schema job 的注释。
      - name: 装成 wheel 跑（退出码 1 = 有发现，是预期结果）
        run: |
          set +e
          uv tool run --from . geo-audit --replay-fixtures mistral.ai \
            --contact ci@geo-audit.invalid --no-cache \
            --out /tmp/r --format html
          code=$?
          set -e
          echo "geo-audit 退出码 $code"
          case "$code" in
            0|1|2) : ;;
            *) echo "::error::CLI 退出码 $code"; exit 1 ;;
          esac
          test -s /tmp/r/mistral.ai.html
      - name: 报告必须自包含且含 75/75 那条结论
        run: |
          python - <<'PY'
          import pathlib, re
          h = pathlib.Path('/tmp/r/mistral.ai.html').read_text(encoding='utf-8')
          # '75' in h 太弱：任何含数字 75 的报告都能过。现在有真报告了，
          # 断言那条**具体结论**的形态 —— 索引内链 75 条全死、且收敛成 1 处根因。
          assert '75/75' in h, "缺少 mistral 的 75/75 结论（索引内链全死）"
          assert '改 1 处 → 修 75 条' in h, "缺少根因归并的结论（75 条应收敛成 1 处）"
          for pat in (r'<link[^>]+rel=["\']?stylesheet', r'<script[^>]+\bsrc=',
                      r'<img[^>]+\bsrc=["\']?https?:', r'@import', r'url\(\s*["\']?https?:'):
              assert re.search(pat, h, re.I) is None, f"报告不自包含：{pat}"
          assert len(h.encode()) < 2_000_000
          PY
