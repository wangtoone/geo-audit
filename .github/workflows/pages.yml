name: pages
# 把 docs/ 发到 GitHub Pages —— README 第一屏指向的那个真实报告画廊（§7.4(c)）。
#
# **只发布仓库里已提交的 HTML，不在 CI 里重跑 build_gallery。**
#
# 原来是每次都 replay 重跑一遍，理由是「改了判定忘了重跑画廊会静默发生」。
# 那个担心是对的，但 replay 这条路已经走不通了：判定层堵掉「没抓过的响应
# 也能出结论」那个洞之后，replay 语料覆盖不到探测集里的多数位置，九份报告
# 首屏全变成「这次扫描不可信」—— 判决是对的，但对读者没有信息量。
#
# 于是把两件事分开：
#   * **判定的可复现性** 由 42 条标注 + `scripts/fp_gate.py` 保证，走 CI；
#   * **画廊** 只负责「这是九份真跑出来的报告」，用 `--live` 本地重建后提交。
#
# CI 不该爬真网络：不礼貌、不确定、且每次 push docs 都会再爬一轮。
# 「忘了重跑画廊」改由 tests/test_readme_claims.py 与 test_never_fetched.py
# 的产物闸接住 —— 它们比「每次重跑」更直接地盯住了报告本身。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_gallery.py"
      - "src/**"
      - "fixtures/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/pages.yml"
  # 不再按月重跑：CI 不重建报告了。画廊过期由 fixture-freshness.yml 每周
  # 对活网 diff 发现，重建用 `build_gallery.py --live` 本地做。
  workflow_dispatch:

# ⚠️ 一次性前置：仓库的 Pages 必须先启用、且来源设成 GitHub Actions，
# 否则 configure-pages 会以
#     Get Pages site failed ... Error: Not Found
# 失败 —— 那句报错**不提示**去哪开，实测白查了一轮。命令：
#     gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
# （或 Settings → Pages → Source: GitHub Actions）
# 这里刻意不写 `enablement: true` 自动开：那会让任何 fork 都去改仓库设置，
# 而 fork 通常没有那个权限，失败信息比现在更难读。

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --locked --extra dev
      # 只跑措辞纪律闸门，不重建报告。断网跑：这一步本来就不该联网。
      - name: 措辞纪律闸门（不重建报告）
        run: uv run python scripts/build_gallery.py --check-copy-only
        env:
          GEO_AUDIT_FORBID_NETWORK: "1"
          GEO_AUDIT_FORBID_DNS: "1"
          GEO_AUDIT_CONTACT: ci@geo-audit.invalid
      - name: 每份报告与索引页都必须自包含
        run: |
          python - <<'PY'
          import pathlib, re
          pages = sorted(pathlib.Path('docs').glob('*.html')) + \
                  sorted(pathlib.Path('docs/reports').glob('*.html'))
          assert pages, 'docs/ 下一份 HTML 都没有'
          for p in pages:
              h = p.read_text(encoding='utf-8')
              for pat in (r'<link[^>]+rel=["\']?stylesheet', r'<script[^>]+\bsrc=',
                          r'<img[^>]+\bsrc=["\']?https?:', r'@import',
                          r'url\(\s*["\']?https?:'):
                  assert re.search(pat, h, re.I) is None, f'{p} 不自包含：{pat}'
              assert len(h.encode()) < 2_000_000, f'{p} 超过 2 MB'
              print(p, len(h.encode()) // 1024, 'KB')
          PY
      - name: README 第一屏的报告链接必须都存在
        run: |
          python - <<'PY'
          import pathlib, re
          readme = pathlib.Path('README.md').read_text(encoding='utf-8')
          missing = [m for m in re.findall(r'docs/reports/([A-Za-z0-9.\-]+\.html)', readme)
                     if not pathlib.Path('docs/reports', m).exists()]
          assert not missing, f'README 指到不存在的报告：{missing}'
          print('README 里的报告链接全部存在')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
